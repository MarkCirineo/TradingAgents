<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TradingAgents — Real-time autonomous trading dashboard">
    <title>TradingAgents Dashboard</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

    <!-- Design System -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- Top Navigation Bar                                     -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <nav class="topbar" id="topbar">
        <div class="topbar__left">
            <div class="topbar__logo">
                <span class="topbar__logo-icon">◈</span>
                <span class="topbar__logo-text">TradingAgents</span>
            </div>
        </div>
        <div class="topbar__center">
            <a href="/" class="topbar__nav-link active" data-page="dashboard">Dashboard</a>
            <a href="/orders" class="topbar__nav-link" data-page="orders">Orders</a>
            <a href="/alpaca" class="topbar__nav-link" data-page="alpaca">Alpaca</a>
            <a href="/compare" class="topbar__nav-link" data-page="compare">A/B</a>
            <a href="/config" class="topbar__nav-link" data-page="config">Config</a>
        </div>
        <div class="topbar__right">
            <div class="topbar__status" id="daemon-status">
                <span class="status-dot status-dot--loading"></span>
                <span class="status-text">Connecting…</span>
            </div>
            <div class="topbar__clock" id="market-clock">
                <span class="clock-label">Market</span>
                <span class="clock-status" id="market-status">—</span>
            </div>
            <div class="topbar__mode" id="pipeline-mode">
                <span class="mode-badge">—</span>
            </div>
        </div>
    </nav>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- Main Content Area (SPA pages render here)              -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <main class="main-content" id="app">
        <div class="loading-screen" id="loading-screen">
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading dashboard…</p>
        </div>
    </main>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- Footer                                                 -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <footer class="footer" id="footer">
        <span class="footer__updated" id="last-updated">Last updated: —</span>
        <span class="footer__version">v0.1.0</span>
    </footer>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- JavaScript (order matters: utilities first)            -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/charts.js"></script>
    <script src="/static/js/pages/dashboard.js"></script>
    <script src="/static/js/pages/orders.js"></script>
    <script src="/static/js/pages/position.js"></script>
    <script src="/static/js/pages/alpaca.js"></script>
    <script src="/static/js/pages/ab.js"></script>
    <script src="/static/js/pages/config.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
